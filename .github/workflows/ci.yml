name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # v0.10.0: the rung's own words are "CI on Linux, macOS and Windows,
  # because should work is not evidence". Development happens on WSL2, so
  # every claim about the other two was an assertion until this job existed.
  #
  # Not a full 3x3. Linux covers the Python range because it is the cheap
  # runner; macOS and Windows run one version each, because what they test
  # is the operating system rather than the interpreter, and macOS runners
  # bill at a multiplier. Five jobs, not nine.
  test:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is not supported: spaCy 3.8's thinc dependency has no wheel
        # for it (Requires-Python >=3.10). See pyproject.toml's
        # requires-python and CONTRIBUTING.md.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm
      - name: Download NLTK WordNet data
        run: python -m nltk.downloader wordnet omw-2.0
      - name: Run unit tests
        run: pytest tests/ -m "not integration"

  # requirements.txt and requirements-dev.txt are not what the job above
  # installs, so nothing used to check them. Dependabot bumped thinc to 9.1.1
  # in requirements.txt, CI went green on all three Python versions, and the
  # file was uninstallable: spaCy 3.8 requires thinc<8.4.0.
  pins:
    name: pinned requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install the checker's own dependencies
        run: pip install packaging tomli
      - name: requirements.txt resolves
        run: pip install --dry-run --quiet -r requirements.txt
      - name: requirements-dev.txt resolves
        run: pip install --dry-run --quiet -r requirements-dev.txt
      - name: Pins agree with pyproject.toml
        run: python scripts/check_pins.py
