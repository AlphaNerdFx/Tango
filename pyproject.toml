[build-system]
# 77 is the floor for the SPDX `license` string and `license-files` below.
# The older `license = { text = "MIT" }` table is deprecated and warns on
# every build with a current setuptools.
requires      = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# Project metadata
# =============================================================================

[project]
# The distribution name, decided 3 September 2026 for v0.8.0. `tango` on
# PyPI is an unrelated project, so the name a user types and the name pip
# fetches cannot be the same string. They do not have to be: the console
# script below stays `tango`, which is the only one anybody types twice.
name        = "tango-anki"
dynamic     = ["version"]
description = "Turn YouTube transcripts into Anki flashcards for language learners"
readme      = "README.md"
requires-python = ">=3.10"
license      = "MIT"
license-files = ["LICENSE"]
authors     = [{ name = "Youssef Larbi" }]
keywords    = ["anki", "flashcards", "language-learning", "youtube", "vocabulary", "spaced-repetition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Text Processing :: Linguistic",
]

# =============================================================================
# Runtime dependencies
# These are the only packages needed to run the pipeline.
# Installed via: pip install -e .
# =============================================================================

dependencies = [
    # Transcript extraction from YouTube
    "youtube-transcript-api>=1.2.4,<2.0",

    # NLP, tokenization, lemmatization, POS tagging
    # Model downloaded separately: python -m spacy download en_core_web_sm
    "spacy>=3.8,<4.0",

    # Fuzzy string matching for deck confidence interval check
    "rapidfuzz>=3.0,<4.0",

    # HTTP client, MW API and dictionaryapi.dev calls
    "requests>=2.28,<3.0",

    # Anki package generation, produces .apkg files without Anki running
    "genanki>=0.13,<1.0",

    # Environment variable management, .env file support
    "python-dotenv>=1.0,<2.0",

    # Command line. Light: typer plus click, a few hundred KB, and it was
    # already present as a transitive dependency of libretranslate before it
    # was declared here. Constraint 3.6 is about heavy runtime dependencies
    # and this is not one.
    "typer>=0.12,<1.0",
]

# Measured 3 September 2026, in a clean venv: the list above resolves to
# 58 packages and 334 MB on disk. No torch, no translation stack. 236 MB
# of it -- 74% -- is spacy and the numeric stack it needs (spacy 119,
# numpy 41, blis 34, numpy.libs 27, thinc 15), which is not removable
# while spacy is the NLP engine. Re-measure before quoting this; CLAUDE.md
# 3.6 records what happens to a number nobody checks.

# =============================================================================
# Optional dependencies
# Dev tools: installed via: pip install -e ".[dev]"
# Not needed to run the pipeline, only for development and testing.
# =============================================================================

[project.optional-dependencies]
wordnet = [
    # Supplements the synonym and antonym fields, and nothing else. Every
    # import of it in definition.py sits inside a function inside a
    # try/except that returns empty lists, so an install without this is a
    # working install with thinner synonyms -- verified 3 September 2026 by
    # blocking the import and calling both entry points, which returned
    # ([], []) rather than raising. That is why it is an extra rather than a
    # base dependency: 13 MB of package plus a separate corpus download at
    # first run, for a supplementary source.
    #
    # After installing run: python -m nltk.downloader wordnet omw-2.0
    # (omw-1.4 installs without error but this NLTK version never uses it,
    # see ADR-008)
    "nltk>=3.8",
]
translation = [
    # Required for DEF_LANG translation mode.
    # Install via: make translate-setup
    "argostranslate>=1.9",
    "libretranslate>=1.6",
]
dev = [
    # The wordnet extra, so the test suite keeps exercising the paths that
    # use it. Dropping it from the base install must not drop it from CI.
    "tango-anki[wordnet]",

    # Building and uploading the distribution. `python -m build` produces
    # the sdist and wheel; `twine check` validates the metadata renders on
    # PyPI before an upload that cannot be undone, since a version number
    # is burned even if the file is later deleted.
    "build>=1.0",
    "twine>=5.0",

    # Test runner
    "pytest>=8.0,<10.0",

    # Coverage measurement, `make coverage`
    "pytest-cov>=5.0",

    # Code formatter
    "black>=24.0",

    # Linter
    "ruff>=0.4",

    # Static type checker
    "mypy>=1.9",

    # Type stubs for requests (used by mypy)
    "types-requests>=2.28",

    # Reads pyproject.toml back in tests/test_hard_constraints.py, which is
    # how constraints 3.5 and 3.6 are enforced. stdlib tomllib only exists
    # from 3.11 and this project runs on 3.10, so the test imports tomllib
    # first and falls back to this.
    "tomli>=2.0; python_version < '3.11'",
]

# =============================================================================
# Package discovery
# =============================================================================

# A table header claims every key under it until the next header, so this
# block sits below the last bare `project.*` key. Put it up beside
# `classifiers` and the `dependencies` list underneath becomes
# `project.urls.dependencies`, which fails the build.
[project.urls]
Homepage   = "https://github.com/AlphaNerdFx/Tango"
Repository = "https://github.com/AlphaNerdFx/Tango"
Changelog  = "https://github.com/AlphaNerdFx/Tango/blob/main/CHANGELOG.md"
Issues     = "https://github.com/AlphaNerdFx/Tango/issues"

[project.scripts]
# The command a user types. `tango` even though the distribution is
# `tango-anki`, because the script name and the PyPI name are independent
# and only one of them gets typed more than once.
tango = "pipeline.__main__:main"

[tool.setuptools.dynamic]
# Single source of truth: src/pipeline/__init__.py
version = { attr = "pipeline.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# =============================================================================
# Pytest configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths    = ["tests"]
pythonpath   = ["src"]
markers      = [
    "integration: hits external services or requires a running Anki instance",
]
# Default: skip integration tests unless explicitly requested
addopts      = "-m 'not integration' --tb=short -q"

# =============================================================================
# Black configuration
# =============================================================================

[tool.black]
line-length    = 100
target-version = ["py310", "py311", "py312"]
include        = '(src/pipeline|tests)/.*\.py$'

# =============================================================================
# Ruff configuration
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long, black handles this
    "B008",  # do not perform function calls in default args
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests

# =============================================================================
# Mypy configuration
# =============================================================================

[tool.mypy]
python_version         = "3.10"
warn_return_any        = true
warn_unused_configs    = true
ignore_missing_imports = true
files                  = ["src/pipeline"]